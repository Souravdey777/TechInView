<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechInView — voice-first AI interview prep for software engineers">
  <defs>
    <linearGradient id="hero-brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b0e14" />
      <stop offset="1" stop-color="#07080a" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-green" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#34D399" stop-opacity="0.22" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1a2332" fill-opacity="0.5" />
    </pattern>
    <clipPath id="card-clip">
      <rect x="720" y="80" width="496" height="444" rx="22" />
    </clipPath>

    <!-- ── Siri orb assets ── -->
    <radialGradient id="orb-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.42" />
      <stop offset="0.55" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-base" cx="0.42" cy="0.38" r="0.72">
      <stop stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="0.7" stop-color="#07080a" stop-opacity="0.92" />
      <stop offset="1" stop-color="#07080a" />
    </radialGradient>
    <radialGradient id="orb-core" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#EAFBFF" stop-opacity="0.85" />
      <stop offset="0.4" stop-color="#22D3EE" stop-opacity="0.45" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-sheen" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <clipPath id="orb-clip">
      <circle cx="968" cy="210" r="42" />
    </clipPath>
    <filter id="orb-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="560" fill="url(#hero-bg)" />
  <rect width="1280" height="560" fill="url(#dots)" />
  <circle cx="140" cy="70" r="360" fill="url(#glow-cyan)" />
  <circle cx="1180" cy="520" r="380" fill="url(#glow-green)" />

  <!-- ============ LEFT: brand + message ============ -->
  <!-- Logo mark -->
  <g transform="translate(64, 60)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#10161F" stroke="#22D3EE" stroke-opacity="0.22" />
    <path d="M18 13H14C10.686 13 8 15.686 8 19V33C8 36.314 10.686 39 14 39H18" stroke="url(#hero-brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 13H38C41.314 13 44 15.686 44 19V33C44 36.314 41.314 39 38 39H34" stroke="url(#hero-brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="19" y="21" width="3.4" height="10" rx="1.7" fill="url(#hero-brand)"/>
    <rect x="24.3" y="17" width="3.4" height="18" rx="1.7" fill="url(#hero-brand)"/>
    <rect x="29.6" y="21" width="3.4" height="10" rx="1.7" fill="url(#hero-brand)"/>
    <text x="66" y="26" fill="#E2E8F0" font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.6">TechInView</text>
    <text x="67" y="46" fill="#7A8BA3" font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" letter-spacing="2.4">VOICE-FIRST AI INTERVIEWS</text>
  </g>

  <!-- Headline -->
  <g font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="62" y="214" fill="#F2F5F9" font-size="58" font-weight="800" letter-spacing="-1.8">Practice the interview</text>
    <text x="62" y="278" font-size="58" font-weight="800" letter-spacing="-1.8">
      <tspan fill="url(#hero-brand)">you're about to face.</tspan>
    </text>
    <text x="64" y="330" fill="#9FB0C6" font-size="21" font-weight="400" letter-spacing="-0.2">Real-time voice mock interviews for software engineers —</text>
    <text x="64" y="360" fill="#9FB0C6" font-size="21" font-weight="400" letter-spacing="-0.2">DSA, technical Q&amp;A, and hiring-manager loops with</text>
    <text x="64" y="390" fill="#9FB0C6" font-size="21" font-weight="400" letter-spacing="-0.2">company-style personas and instant, actionable feedback.</text>
  </g>

  <!-- Feature pills -->
  <g font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(64, 434)">
      <rect width="118" height="38" rx="19" fill="#111820" stroke="#1a2332" />
      <circle cx="22" cy="19" r="4" fill="#22D3EE" />
      <text x="36" y="24" fill="#C7D2E0">DSA rounds</text>
    </g>
    <g transform="translate(192, 434)">
      <rect width="150" height="38" rx="19" fill="#111820" stroke="#1a2332" />
      <circle cx="22" cy="19" r="4" fill="#34D399" />
      <text x="36" y="24" fill="#C7D2E0">Technical Q&amp;A</text>
    </g>
    <g transform="translate(352, 434)">
      <rect width="152" height="38" rx="19" fill="#111820" stroke="#1a2332" />
      <circle cx="22" cy="19" r="4" fill="#fbbf24" />
      <text x="36" y="24" fill="#C7D2E0">Eng Manager</text>
    </g>
    <g transform="translate(514, 434)">
      <rect width="130" height="38" rx="19" fill="#111820" stroke="#1a2332" />
      <circle cx="22" cy="19" r="4" fill="#f472b6" />
      <text x="36" y="24" fill="#C7D2E0">Personas</text>
    </g>
  </g>

  <!-- ============ RIGHT: interview room mock ============ -->
  <g clip-path="url(#card-clip)">
    <rect x="720" y="80" width="496" height="444" fill="#0d1017" />
    <circle cx="968" cy="210" r="150" fill="url(#glow-cyan)" opacity="0.6" />
  </g>
  <rect x="720" y="80" width="496" height="444" rx="22" fill="none" stroke="#1a2332" />

  <!-- Card header -->
  <g font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <circle cx="752" cy="112" r="15" fill="#10161F" stroke="#22D3EE" stroke-opacity="0.35" />
    <text x="752" y="117" text-anchor="middle" fill="#22D3EE" font-size="14" font-weight="700">G</text>
    <text x="778" y="108" fill="#E2E8F0" font-size="15" font-weight="600">Google · Staff Interviewer</text>
    <text x="778" y="126" fill="#7A8BA3" font-size="12" font-weight="500">DSA Interview · 45 min</text>
    <!-- Live indicator -->
    <rect x="1120" y="100" width="72" height="26" rx="13" fill="#0f1f18" stroke="#34D399" stroke-opacity="0.4" />
    <circle cx="1136" cy="113" r="4" fill="#34D399" />
    <text x="1147" y="117" fill="#34D399" font-size="12" font-weight="600">LIVE</text>
  </g>
  <line x1="720" y1="142" x2="1216" y2="142" stroke="#1a2332" />

  <!-- ── Siri AI orb ── -->
  <g>
    <!-- ambient glow -->
    <circle cx="968" cy="210" r="74" fill="url(#orb-glow)" />
    <!-- expanding rings -->
    <circle cx="968" cy="210" r="58" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.25" />
    <circle cx="968" cy="210" r="50" fill="none" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1" />
    <!-- sphere base -->
    <circle cx="968" cy="210" r="42" fill="url(#orb-base)" />
    <!-- swirling iridescent blobs (clipped to sphere) -->
    <g clip-path="url(#orb-clip)" filter="url(#orb-blur)">
      <ellipse cx="950" cy="190" rx="27" ry="23" fill="#22D3EE" fill-opacity="0.6" />
      <ellipse cx="988" cy="228" rx="27" ry="25" fill="#34D399" fill-opacity="0.6" />
      <ellipse cx="958" cy="234" rx="22" ry="20" fill="#8B5CF6" fill-opacity="0.42" />
      <ellipse cx="990" cy="188" rx="20" ry="18" fill="#60A5FA" fill-opacity="0.4" />
      <ellipse cx="944" cy="220" rx="16" ry="15" fill="#6EE7B7" fill-opacity="0.35" />
    </g>
    <!-- bright core -->
    <circle cx="966" cy="206" r="16" fill="url(#orb-core)" />
    <!-- surface sheen -->
    <ellipse cx="952" cy="192" rx="20" ry="13" fill="url(#orb-sheen)" />
    <!-- rim highlight -->
    <circle cx="968" cy="210" r="42" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.25" />
  </g>
  <!-- orb caption -->
  <g font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <circle cx="898" cy="296" r="4" fill="#34D399" />
    <text x="910" y="300" fill="#9FB0C6" font-size="12.5" font-weight="500">AI interviewer speaking…</text>
  </g>

  <!-- Transcript bubble -->
  <g font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <rect x="744" y="316" width="448" height="52" rx="12" fill="#111820" stroke="#1a2332" />
    <text x="762" y="339" fill="#9FB0C6" font-size="13" font-weight="500">"Walk me through your approach before you</text>
    <text x="762" y="357" fill="#9FB0C6" font-size="13" font-weight="500">start coding — what's the time complexity?"</text>
  </g>

  <!-- Code panel -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12.5">
    <rect x="744" y="380" width="448" height="88" rx="12" fill="#080b10" stroke="#1a2332" />
    <circle cx="762" cy="398" r="4" fill="#f472b6" />
    <circle cx="776" cy="398" r="4" fill="#fbbf24" />
    <circle cx="790" cy="398" r="4" fill="#34D399" />
    <text x="812" y="402" fill="#4a5568" font-size="11">two_sum.py</text>
    <text x="762" y="426" fill="#7A8BA3"><tspan fill="#f472b6">def</tspan> <tspan fill="#22D3EE">two_sum</tspan>(nums, target):</text>
    <text x="762" y="444" fill="#7A8BA3">    seen <tspan fill="#9FB0C6">=</tspan> {}</text>
    <text x="762" y="462" fill="#7A8BA3">    <tspan fill="#f472b6">for</tspan> i, n <tspan fill="#f472b6">in</tspan> <tspan fill="#34D399">enumerate</tspan>(nums):</text>
  </g>

  <!-- Score gauge -->
  <g transform="translate(744, 478)" font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <rect x="0" y="0" width="448" height="42" rx="12" fill="#0f1712" stroke="#34D399" stroke-opacity="0.25" />
    <text x="18" y="27" fill="#7A8BA3" font-size="12.5" font-weight="500">Live score</text>
    <rect x="98" y="18" width="230" height="6" rx="3" fill="#1a2332" />
    <rect x="98" y="18" width="193" height="6" rx="3" fill="url(#hero-brand)" />
    <text x="344" y="27" fill="#34D399" font-size="15" font-weight="700">8.4</text>
    <text x="372" y="27" fill="#4a5568" font-size="12" font-weight="500">/ 10</text>
  </g>
</svg>
